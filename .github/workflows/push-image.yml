name: push-image

on:
  workflow_call:
    inputs:
      image_tag:
        description: Image tag to publish
        required: true
        type: string
      ref:
        description: Git ref or SHA to build
        required: true
        type: string

env:
  DOCKER_BASE_NAME: ghcr.io/${{ github.repository }}

jobs:
  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile

  push-image:
    runs-on: ubuntu-latest
    needs: hadolint
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - name: Build image
        env:
          PKG_TAG: ${{ env.DOCKER_BASE_NAME }}:${{ inputs.image_tag }}
        run: docker build --no-cache . -t "${PKG_TAG}"
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        env:
          PKG_TAG: ${{ env.DOCKER_BASE_NAME }}:${{ inputs.image_tag }}
        run: docker push "${PKG_TAG}"
